})(window,document,'script','dataLayer','GTM-WXFGM7H5');</script>

<title>Cadastro Concluído | Movia</title>
<meta name="description" content="Cadastro concluído com sucesso. Em breve nossa equipe entrará em contato.">

<!-- URL canonica sem .html — o Caddyfile ja faz 308 de /obrigado.html. -->

<!-- Mesma troca do index: @import dentro do <style> serializa a descoberta
     da fonte; <link> + preconnect deixa o preload scanner adiantar. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Inter:wght@400;500;600&display=swap">

<style>
:root {
  --bg: #000000;
  --white: #FFFFFF;
  --orange-2: #FFB400;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--white);
  font-family: 'Inter', Arial, sans-serif;
}

.wrap {
  min-height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 36px 24px;
}

.content {
  width: min(1400px, 100%);
  text-align: center;
}

.logo {
  margin: 0 auto 72px;
  display: flex;
  justify-content: center;
}

.logo img {
  width: min(340px, 72vw);
  height: auto;
  display: block;
}

h1 {
  margin: 0 0 34px 0;
  font-family: 'Bricolage Grotesque', Arial, sans-serif;
  font-size: clamp(56px, 8vw, 128px);
  line-height: 0.95;
  letter-spacing: -0.05em;
  font-weight: 800;
}

h1 .light {
  color: var(--white);
}

h1 .accent {
  color: var(--orange-2);
}

p {
  margin: 0 auto;
  max-width: 1450px;
  font-size: clamp(18px, 2vw, 28px);
  line-height: 1.5;
  color: rgba(255,255,255,.96);
}

@media (max-width: 768px) {
  .logo {
    margin-bottom: 44px;
  }
  h1 {
    margin-bottom: 22px;
  }
}
</style>
</head>
<body>
<!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-WXFGM7H5"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<!-- End Google Tag Manager (noscript) -->
  <div class="wrap">
    <div class="content">
      <div class="logo">
        <img src="assets/logo-movia.webp" alt="Movia">
      </div>

      <h1>
        <span class="light">Cadastro </span><span class="accent">Concluído!</span>
      </h1>

      <p>
        Recebemos sua solicitação de demonstração. Nossa equipe entrará em contato pelo WhatsApp ou telefone para conhecer melhor a operação da sua loja e agendar uma apresentação personalizada da Movia.
      </p>
    </div>
  </div>
<script>
// >>> meta-lead >>>
// Dispara o evento padrão `Lead` da Meta exatamente uma vez por cadastro
// confirmado. A confirmação só é criada pela função sucesso() do form
// (gravação confirmada na planilha); acesso direto ou refresh do /obrigado
// não têm confirmação e não disparam nada. O Pixel base é carregado pelo
// GTM — nada de código base aqui (evita PageView duplicado).
(function(){
  var CHAVE = 'movia_lead_confirmado';
  var PIXEL_ID = '4283843718520684';
  var bruto;
  try { bruto = sessionStorage.getItem(CHAVE); } catch(e){ return; }
  if(!bruto) return;
  var conf = null;
  try { conf = JSON.parse(bruto); } catch(e){}
  if(!conf || !conf.eventId){
    try { sessionStorage.removeItem(CHAVE); } catch(e){}
    return;
  }
  var tentativas = 0;
  (function esperaFbq(){
    if(typeof window.fbq === 'function'){
      window.fbq('trackSingle', PIXEL_ID, 'Lead',
        { content_name: 'Solicitação de demonstração Movia' },
        { eventID: conf.eventId });
      // Remoção só DEPOIS do comando enviado ao fbq — refresh não re-dispara.
      try { sessionStorage.removeItem(CHAVE); } catch(e){}
      window.dataLayer = window.dataLayer || [];
      window.dataLayer.push({ event: 'meta_lead_disparado', event_id: conf.eventId });
      return;
    }
    tentativas++;
    // Espera controlada: 100ms x 50 = 5s no máximo; sem loop infinito. Se o
    // fbq nunca chegar (ad blocker), a confirmação fica — nunca é descartada
    // sem o Lead ter sido enviado.
    if(tentativas < 50) setTimeout(esperaFbq, 100);
  })();
})();
// <<< meta-lead <<<
</script>
</body>
</html>
